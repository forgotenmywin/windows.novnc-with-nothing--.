
name: Windows 11 - Mesa3D + RDP + noVNC + Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # --------------------------------------------------
      # 1. Check secrets and prepare Windows
      # --------------------------------------------------
      - name: Prepare Windows and credentials
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "GitHub Secret RDP_PASSWORD is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "GitHub Secret VNC_PASSWORD is missing."
          }

          if ($env:VNC_PASSWORD.Length -ne 8 -or $env:VNC_PASSWORD -notmatch '^[\x21-\x7E]{8}$') {
            throw "VNC_PASSWORD must contain exactly 8 printable ASCII characters."
          }

          $user = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue

          if (-not $user) {
            $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
            New-LocalUser -Name "runneradmin" -Password $securePassword -PasswordNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member "runneradmin"
          }
          else {
            $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
            Set-LocalUser -Name "runneradmin" -Password $securePassword
          }

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "Windows credentials and RDP configuration prepared."

      # --------------------------------------------------
      # 2. Install 7-Zip
      # --------------------------------------------------
      - name: Install 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          if (-not (Test-Path $sevenZip)) {
            choco install 7zip -y --no-progress
          }

          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip installation failed."
          }

          Write-Host "7-Zip is ready."

      # --------------------------------------------------
      # 3. Download and extract Mesa3D
      # --------------------------------------------------
      - name: Download Mesa3D
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $mesaVersion = "26.3.0"
          $work = "C:\MesaInstall"
          $extractRoot = "$work\Extracted"
          $archive = "$work\mesa3d.7z"

          New-Item -ItemType Directory -Force -Path $work | Out-Null
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null

          $headers = @{
            "User-Agent" = "GitHub-Actions-Mesa-Installer"
            "Accept" = "application/vnd.github+json"
          }

          $releaseUrl = "https://api.github.com/repos/pal1000/mesa-dist-win/releases/tags/$mesaVersion"
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers

          $asset = $release.assets |
            Where-Object { $_.name -match 'release-msvc.*\.7z$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Mesa3D MSVC archive was not found in release $mesaVersion."
          }

          Write-Host "Downloading: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive

          if (-not (Test-Path $archive)) {
            throw "Mesa3D archive download failed."
          }

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          & $sevenZip x $archive "-o$extractRoot" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Mesa3D archive extraction failed."
          }

          $candidates = @($extractRoot) +
            @(Get-ChildItem -Path $extractRoot -Directory -Recurse |
              Select-Object -ExpandProperty FullName)

          $mesaRoot = $null

          foreach ($candidate in $candidates) {
            $hasX64 = (Test-Path (Join-Path $candidate "x64\opengl32.dll")) -or
                      (Test-Path (Join-Path $candidate "x64\libgallium_wgl.dll"))

            $hasX86 = (Test-Path (Join-Path $candidate "x86\opengl32.dll")) -or
                      (Test-Path (Join-Path $candidate "x86\libgallium_wgl.dll"))

            if ($hasX64 -and $hasX86) {
              $mesaRoot = $candidate
              break
            }
          }

          if (-not $mesaRoot) {
            throw "Could not find Mesa3D x64 and x86 driver folders."
          }

          "MESA_ROOT=$mesaRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Mesa3D extracted to: $mesaRoot"
          Get-ChildItem $mesaRoot

      # --------------------------------------------------
      # 4. Get official deployment scripts and modules
      # --------------------------------------------------
      - name: Prepare Mesa3D deployment utility
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = "C:\MesaInstall\mesa-source"

          git clone --depth 1 https://github.com/pal1000/mesa-dist-win.git $source

          if ($LASTEXITCODE -ne 0) {
            throw "Could not download Mesa3D deployment utility."
          }

          $bin = Join-Path $source "bin"

          if (-not (Test-Path "$bin\systemwidedeploy.cmd")) {
            throw "systemwidedeploy.cmd was not found."
          }

          if (-not (Test-Path "$bin\modules")) {
            throw "Mesa3D deployment modules folder was not found."
          }

          Copy-Item -Path "$bin\*" -Destination $env:MESA_ROOT -Recurse -Force

          if (-not (Test-Path "$env:MESA_ROOT\systemwidedeploy.cmd")) {
            throw "Deployment script was not copied."
          }

          if (-not (Test-Path "$env:MESA_ROOT\modules\prompt.cmd")) {
            throw "Required deployment modules were not copied."
          }

          Write-Host "Mesa3D deployment utility prepared."

      # --------------------------------------------------
      # 5. Deploy Mesa3D desktop OpenGL drivers
      # --------------------------------------------------
      - name: Deploy Mesa3D system-wide OpenGL
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:MESA_ROOT "systemwidedeploy.cmd"

          if (-not (Test-Path "$env:MESA_ROOT\x64\opengl32.dll")) {
            throw "Mesa3D x64 OpenGL driver is missing."
          }

          if (-not (Test-Path "$env:MESA_ROOT\x86\opengl32.dll")) {
            throw "Mesa3D x86 OpenGL driver is missing."
          }

          Write-Host "Deploying option 1: Core desktop OpenGL drivers."

          Push-Location $env:MESA_ROOT

          try {
            & cmd.exe /c "`"$script`" 1"

            if ($LASTEXITCODE -ne 0) {
              throw "Mesa3D deployment utility returned exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          $driver = "$env:windir\System32\mesadrv.dll"

          if (-not (Test-Path $driver)) {
            throw "Mesa3D deployment did not create System32\mesadrv.dll."
          }

          Write-Host "Mesa3D system-wide driver deployed."
          Get-Item $driver | Format-List FullName, Length, LastWriteTime

          if (Test-Path "$env:windir\SysWOW64\mesadrv.dll") {
            Write-Host "32-bit Mesa3D driver deployed too."
          }

      # --------------------------------------------------
      # 6. Configure Mesa environment
      # --------------------------------------------------
      - name: Configure Mesa environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          "GALLIUM_DRIVER=llvmpipe" | Out-File $env:GITHUB_ENV -Append
          "MESA_GL_VERSION_OVERRIDE=4.5" | Out-File $env:GITHUB_ENV -Append
          "MESA_GLSL_VERSION_OVERRIDE=450" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Mesa environment variables configured."
          Write-Host "Note: these variables apply to processes started with this environment."

      # --------------------------------------------------
      # 7. Install TightVNC
      # --------------------------------------------------
      - name: Install TightVNC
        shell: powershell
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tightvnc.msi"
          $url = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "TightVNC installer download failed."
          }

          $arguments = @(
            "/i"
            "`"$installer`""
            "/qn"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$env:VNC_PASSWORD"
            "SET_USECONTROLAUTHENTICATION=0"
          )

          $process = Start-Process -FilePath "msiexec.exe" `
            -ArgumentList $arguments -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "TightVNC installation failed with exit code $($process.ExitCode)."
          }

          Write-Host "TightVNC installation completed."

      # --------------------------------------------------
      # 8. Start and verify TightVNC
      # --------------------------------------------------
      - name: Start TightVNC service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service -Name "tvnserver" -ErrorAction SilentlyContinue

          if (-not $service) {
            throw "TightVNC service was not found."
          }

          Set-Service -Name "tvnserver" -StartupType Automatic
          Start-Service -Name "tvnserver"

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2

            if (Test-NetConnection 127.0.0.1 -Port 5900 -InformationLevel Quiet) {
              $ready = $true
              break
            }
          }

          if (-not $ready) {
            throw "TightVNC did not open TCP port 5900."
          }

          Write-Host "TightVNC is listening on port 5900."

      # --------------------------------------------------
      # 9. Install Python
      # --------------------------------------------------
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 10. Install and verify websockify
      # --------------------------------------------------
      - name: Install websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          python -m pip install websockify

          python -m pip show websockify

          python -m websockify --help

          if ($LASTEXITCODE -ne 0) {
            throw "websockify verification failed."
          }

          Write-Host "websockify installed and verified."

      # --------------------------------------------------
      # 11. Download noVNC
      # --------------------------------------------------
      - name: Download noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\noVNC") {
            Remove-Item "C:\noVNC" -Recurse -Force
          }

          git clone --depth 1 https://github.com/novnc/noVNC.git C:\noVNC

          if ($LASTEXITCODE -ne 0) {
            throw "noVNC download failed."
          }

          if (-not (Test-Path "C:\noVNC\vnc.html")) {
            throw "noVNC vnc.html was not found."
          }

          Write-Host "noVNC is ready."

      # --------------------------------------------------
      # 12. Download cloudflared
      # --------------------------------------------------
      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $cloudflared = "C:\cloudflared.exe"
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          Invoke-WebRequest -Uri $url -OutFile $cloudflared

          if (-not (Test-Path $cloudflared)) {
            throw "cloudflared download failed."
          }

          & $cloudflared --version

          if ($LASTEXITCODE -ne 0) {
            throw "cloudflared could not run."
          }

          Write-Host "cloudflared is ready."

      # --------------------------------------------------
      # 13. Start websockify
      # --------------------------------------------------
      - name: Start noVNC websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $python = (Get-Command python).Source

          $out = "C:\websockify-out.log"
          $err = "C:\websockify-err.log"

          $process = Start-Process -FilePath $python `
            -ArgumentList @(
              "-m", "websockify",
              "--web", "C:\noVNC",
              "--verbose",
              "0.0.0.0:6080",
              "127.0.0.1:5900"
            ) `
            -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardOutput $out `
            -RedirectStandardError $err

          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw "websockify exited unexpectedly."
          }

          $ready = $false

          for ($i = 0; $i -lt 20; $i++) {
            if (Test-NetConnection 127.0.0.1 -Port 6080 -InformationLevel Quiet) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw "websockify did not open port 6080."
          }

          Write-Host "noVNC websockify is listening on port 6080."

      # --------------------------------------------------
      # 14. Start Cloudflare Quick Tunnel
      # --------------------------------------------------
      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $cloudflared = "C:\cloudflared.exe"
          $out = "C:\cloudflared-out.log"
          $err = "C:\cloudflared-err.log"

          if (Test-Path $out) { Remove-Item $out -Force }
          if (Test-Path $err) { Remove-Item $err -Force }

          $tunnel = Start-Process -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel",
              "--url",
              "http://127.0.0.1:6080",
              "--no-autoupdate"
            ) `
            -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardOutput $out `
            -RedirectStandardError $err

          $publicUrl = $null

          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2

            $log = ""

            if (Test-Path $out) {
              $log += Get-Content $out -Raw -ErrorAction SilentlyContinue
            }

            if (Test-Path $err) {
              $log += Get-Content $err -Raw -ErrorAction SilentlyContinue
            }

            if ($log -match 'https://[a-z0-9-]+\.trycloudflare\.com') {
              $publicUrl = $Matches[0]
              break
            }

            if ($tunnel.HasExited) {
              Get-Content $out, $err -ErrorAction SilentlyContinue
              throw "cloudflared exited before creating the tunnel."
            }
          }

          if (-not $publicUrl) {
            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw "Could not obtain the Cloudflare Quick Tunnel URL."
          }

          "PUBLIC_URL=$publicUrl" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Cloudflare tunnel created: $publicUrl"

      # --------------------------------------------------
      # 15. Verify public noVNC page
      # --------------------------------------------------
      - name: Verify public noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "$env:PUBLIC_URL/vnc.html"
          $success = $false

          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $url -TimeoutSec 15 -UseBasicParsing

              if ($response.StatusCode -eq 200) {
                $success = $true
                break
              }
            }
            catch {
              Write-Host "Waiting for public endpoint..."
            }

            Start-Sleep -Seconds 5
          }

          if (-not $success) {
            throw "Public noVNC page could not be verified."
          }

          Write-Host "Public noVNC page is responding."

      # --------------------------------------------------
      # 16. Print connection details
      # --------------------------------------------------
      - name: Show connection details
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " WINDOWS DESKTOP IS READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "noVNC address:"
          Write-Host "$env:PUBLIC_URL/vnc.html"
          Write-Host ""
          Write-Host "VNC port: 5900"
          Write-Host "VNC password: GitHub Secret VNC_PASSWORD"
          Write-Host ""
          Write-Host "RDP address: Use the runner connection details"
          Write-Host "RDP username: runneradmin"
          Write-Host "RDP password: GitHub Secret RDP_PASSWORD"
          Write-Host ""
          Write-Host "=============================================="

      # --------------------------------------------------
      # 17. Keep the runner alive
      # --------------------------------------------------
      - name: Keep Windows desktop alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Desktop session is running."
          Write-Host "The workflow will remain active until its timeout."

          while ($true) {
            Start-Sleep -Seconds 30

            $vnc = Test-NetConnection 127.0.0.1 -Port 5900 -InformationLevel Quiet
            $web = Test-NetConnection 127.0.0.1 -Port 6080 -InformationLevel Quiet

            Write-Host "VNC=$vnc | noVNC=$web | $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"

            if (-not $vnc -or -not $web) {
              Write-Warning "A local desktop service is not responding."
            }
          }
