
name: Windows 11 - Mesa3D + RDP + noVNC + Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. SETUP RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD GitHub Secret is missing."
          }

          $Username = "runneradmin"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $Existing = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($Existing) {
            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword
          }
          else {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group Administrators `
            -Member $Username `
            -ErrorAction SilentlyContinue

          "RDP_USER=$Username" >> $env:GITHUB_ENV

          Write-Host "RDP configured."

      # ============================================================
      # 2. DOWNLOAD AND INSTALL MESА3D
      # ============================================================
      - name: Download and Deploy Mesa3D
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Version = "26.3.0"
          $Work = "C:\MesaInstall"
          $Archive = "$Work\mesa.7z"
          $Extract = "$Work\Extracted"
          $Source = "$Work\mesa-source"

          New-Item -ItemType Directory -Path $Work -Force | Out-Null
          New-Item -ItemType Directory -Path $Extract -Force | Out-Null

          Write-Host "============================================"
          Write-Host "Downloading Mesa3D $Version"
          Write-Host "============================================"

          # --------------------------------------------------------
          # GET OFFICIAL RELEASE INFORMATION
          # --------------------------------------------------------

          $ReleaseUrl = "https://api.github.com/repos/pal1000/mesa-dist-win/releases/tags/$Version"

          $Release = Invoke-RestMethod `
            -Uri $ReleaseUrl `
            -Headers @{ "User-Agent" = "GitHubActions-MesaInstaller" }

          $Asset = $Release.assets |
            Where-Object {
              $_.name -match "release-msvc.*\.7z$"
            } |
            Select-Object -First 1

          if (!$Asset) {
            throw "Official MSVC Mesa archive was not found in release $Version."
          }

          Write-Host "Asset: $($Asset.name)"
          Write-Host "Download URL: $($Asset.browser_download_url)"

          Invoke-WebRequest `
            -Uri $Asset.browser_download_url `
            -OutFile $Archive `
            -UseBasicParsing

          if (!(Test-Path $Archive)) {
            throw "Mesa archive download failed."
          }

          $Size = (Get-Item $Archive).Length

          if ($Size -lt 1000000) {
            throw "Mesa archive is unexpectedly small: $Size bytes"
          }

          Write-Host "Mesa archive downloaded: $Size bytes"

          # --------------------------------------------------------
          # INSTALL 7-ZIP
          # --------------------------------------------------------

          $SevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue

          if (!$SevenZip) {
            Write-Host "Installing 7-Zip..."

            choco install 7zip -y --no-progress

            $SevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          }

          if (!$SevenZip) {
            $Candidates = @(
              "C:\Program Files\7-Zip\7z.exe",
              "C:\Program Files (x86)\7-Zip\7z.exe"
            )

            foreach ($Candidate in $Candidates) {
              if (Test-Path $Candidate) {
                $SevenZipPath = $Candidate
                break
              }
            }
          }
          else {
            $SevenZipPath = $SevenZip.Source
          }

          if (!$SevenZipPath -or !(Test-Path $SevenZipPath)) {
            throw "7-Zip executable not found."
          }

          # --------------------------------------------------------
          # EXTRACT ARCHIVE
          # --------------------------------------------------------

          Write-Host "Extracting Mesa3D..."

          & $SevenZipPath x $Archive "-o$Extract" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Mesa extraction failed. Exit code: $LASTEXITCODE"
          }

          # --------------------------------------------------------
          # LOCATE MESA ROOT
          # --------------------------------------------------------

          $Directories = @($Extract)

          $Directories += Get-ChildItem `
            -Path $Extract `
            -Directory `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          $MesaRoot = $null

          foreach ($Directory in $Directories) {

            $HasX64 = Test-Path "$Directory\x64"
            $HasX86 = Test-Path "$Directory\x86"

            $HasDriver = (
              (Test-Path "$Directory\x64\opengl32.dll") -or
              (Test-Path "$Directory\x64\libgallium_wgl.dll")
            )

            if ($HasX64 -and $HasX86 -and $HasDriver) {
              $MesaRoot = $Directory
              break
            }
          }

          if (!$MesaRoot) {
            throw "Could not locate Mesa x64/x86 driver folders."
          }

          Write-Host "Mesa root: $MesaRoot"

          # --------------------------------------------------------
          # GET OFFICIAL DEPLOYMENT SCRIPT AND MODULES
          # --------------------------------------------------------

          Write-Host "Downloading official deployment utility..."

          git clone `
            --depth 1 `
            https://github.com/pal1000/mesa-dist-win.git `
            $Source

          if ($LASTEXITCODE -ne 0) {
            throw "Could not clone official Mesa repository."
          }

          $DeploySource = "$Source\bin\systemwidedeploy.cmd"
          $ModulesSource = "$Source\bin\modules"

          if (!(Test-Path $DeploySource)) {
            throw "Official systemwidedeploy.cmd was not found."
          }

          if (!(Test-Path "$ModulesSource\break.cmd")) {
            throw "Required Mesa modules\break.cmd was not found."
          }

          if (!(Test-Path "$ModulesSource\prompt.cmd")) {
            throw "Required Mesa modules\prompt.cmd was not found."
          }

          Copy-Item `
            $DeploySource `
            "$MesaRoot\systemwidedeploy.cmd" `
            -Force

          Copy-Item `
            $ModulesSource `
            "$MesaRoot\modules" `
            -Recurse `
            -Force

          $DeployScript = "$MesaRoot\systemwidedeploy.cmd"

          if (!(Test-Path $DeployScript)) {
            throw "Deployment script copy failed."
          }

          # --------------------------------------------------------
          # VERIFY REQUIRED FILES
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Mesa driver files:"

          Get-ChildItem "$MesaRoot\x64" -Filter "*.dll" |
            Select-Object -First 30 -ExpandProperty Name

          $HasOpenGL = (
            (Test-Path "$MesaRoot\x64\opengl32.dll") -or
            (Test-Path "$MesaRoot\x64\libgallium_wgl.dll")
          )

          if (!$HasOpenGL) {
            throw "Mesa x64 desktop OpenGL driver is missing."
          }

          # --------------------------------------------------------
          # DEPLOY OPTION 1
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "============================================"
          Write-Host "Deploying Mesa Core Desktop OpenGL"
          Write-Host "============================================"

          $DeployProcess = Start-Process `
            -FilePath $env:ComSpec `
            -ArgumentList @(
              "/d",
              "/c",
              "`"$DeployScript`" 1"
            ) `
            -WorkingDirectory $MesaRoot `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "Deployment exit code: $($DeployProcess.ExitCode)"

          if ($DeployProcess.ExitCode -ne 0) {
            throw "Mesa deployment failed."
          }

          # --------------------------------------------------------
          # VERIFY SYSTEM-WIDE INSTALLATION
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Checking deployed driver..."

          $SystemDriver = "$env:windir\System32\mesadrv.dll"

          if (!(Test-Path $SystemDriver)) {
            throw "System-wide Mesa driver was not installed."
          }

          Get-Item $SystemDriver |
            Select-Object FullName, Length, LastWriteTime |
            Format-List

          Write-Host "Mesa system-wide deployment completed."

          # --------------------------------------------------------
          # SAVE INSTALLATION PATH
          # --------------------------------------------------------

          "MESA_ROOT=$MesaRoot" >> $env:GITHUB_ENV
          "MESA_DRIVER=$SystemDriver" >> $env:GITHUB_ENV

      # ============================================================
      # 3. INSTALL TIGHTVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "VNC_PASSWORD GitHub Secret is missing."
          }

          if ($env:VNC_PASSWORD.Length -ne 8) {
            throw "VNC_PASSWORD must contain exactly 8 characters."
          }

          $Installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" `
            -OutFile $Installer `
            -UseBasicParsing

          if (!(Test-Path $Installer)) {
            throw "TightVNC installer was not downloaded."
          }

          $Arguments = @(
            "/i"
            "`"$Installer`""
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$env:VNC_PASSWORD"
          )

          $Process = Start-Process `
            -FilePath msiexec.exe `
            -ArgumentList $Arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($Process.ExitCode -ne 0) {
            throw "TightVNC installation failed: $($Process.ExitCode)"
          }

          Write-Host "TightVNC installed."

      # ============================================================
      # 4. CONFIGURE AND START TIGHTVNC
      # ============================================================
      - name: Configure TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $VncExe = "C:\Program Files\TightVNC\tvnserver.exe"
          $RegPath = "HKLM:\SOFTWARE\TightVNC\Server"

          if (!(Test-Path $VncExe)) {
            throw "TightVNC executable not found."
          }

          if (!(Test-Path $RegPath)) {
            throw "TightVNC registry key not found."
          }

          New-ItemProperty `
            -Path $RegPath `
            -Name AcceptRfbConnections `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          New-ItemProperty `
            -Path $RegPath `
            -Name RfbPort `
            -PropertyType DWord `
            -Value 5900 `
            -Force | Out-Null

          New-ItemProperty `
            -Path $RegPath `
            -Name UseVncAuthentication `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          New-ItemProperty `
            -Path $RegPath `
            -Name UseControlAuthentication `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          New-ItemProperty `
            -Path $RegPath `
            -Name AllowLoopback `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          New-ItemProperty `
            -Path $RegPath `
            -Name LoopbackOnly `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          $Config = Get-ItemProperty -Path $RegPath

          if ($null -eq $Config.Password) {
            throw "TightVNC password was not created."
          }

          if ($Config.Password.Length -ne 8) {
            throw "TightVNC password registry value is invalid."
          }

          Write-Host "TightVNC settings verified."

          & $VncExe -stop -silent 2>$null

          Start-Sleep -Seconds 3

          & $VncExe -start -silent 2>$null

          Start-Sleep -Seconds 5

          $Service = Get-Service `
            -Name tvnserver `
            -ErrorAction SilentlyContinue

          if ($Service -and $Service.Status -ne "Running") {
            Start-Service tvnserver
          }

          Get-Service tvnserver |
            Format-Table -AutoSize

      # ============================================================
      # 5. VERIFY VNC
      # ============================================================
      - name: Verify VNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {

            $Result = Test-NetConnection `
              -ComputerName 127.0.0.1 `
              -Port 5900 `
              -WarningAction SilentlyContinue

            if ($Result.TcpTestSucceeded) {
              $Ready = $true
              break
            }

            Write-Host "Waiting for VNC... $i/30"
            Start-Sleep -Seconds 2
          }

          if (!$Ready) {
            throw "VNC is not listening on port 5900."
          }

          Write-Host "VNC is ready."

      # ============================================================
      # 6. INSTALL NOVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $NoVncPath = "C:\noVNC"

          if (Test-Path $NoVncPath) {
            Remove-Item $NoVncPath -Recurse -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $NoVncPath

          if ($LASTEXITCODE -ne 0) {
            throw "noVNC clone failed."
          }

          if (!(Test-Path "$NoVncPath\vnc.html")) {
            throw "noVNC installation failed."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # 7. INSTALL PYTHON AND WEBSOCKIFY
      # ============================================================
      - name: Install Python and websockify
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          python -m pip install websockify

          python -m websockify --version

          Write-Host "websockify installed."

      # ============================================================
      # 8. INSTALL CLOUDFLARED
      # ============================================================
      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $Cloudflared `
            -UseBasicParsing

          if (!(Test-Path $Cloudflared)) {
            throw "cloudflared download failed."
          }

          & $Cloudflared version

          "CLOUDFLARED_EXE=$Cloudflared" >> $env:GITHUB_ENV

      # ============================================================
      # 9. START NOVNC + CLOUDFLARE
      # ============================================================
      - name: Start noVNC + Cloudflare and Keep Alive
        shell: powershell
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $NoVncPath = "C:\noVNC"
          $Cloudflared = $env:CLOUDFLARED_EXE

          $VncTarget = "127.0.0.1:5900"
          $WebPort = 6080
          $Origin = "http://127.0.0.1:6080"

          $WebStdout = "C:\websockify.log"
          $WebStderr = "C:\websockify-error.log"

          $CfStdout = "C:\cloudflared-stdout.log"
          $CfStderr = "C:\cloudflared-stderr.log"
          $CfDebug = "C:\cloudflared-debug.log"

          Remove-Item `
            $WebStdout,
            $WebStderr,
            $CfStdout,
            $CfStderr,
            $CfDebug `
            -Force `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # START WEBSOCKIFY
          # --------------------------------------------------------

          Write-Host "Starting websockify..."

          $WebProcess = Start-Process `
            -FilePath "python.exe" `
            -ArgumentList @(
              "-m",
              "websockify",
              "--web",
              $NoVncPath,
              "--verbose",
              "0.0.0.0:6080",
              $VncTarget
            ) `
            -WorkingDirectory $NoVncPath `
            -RedirectStandardOutput $WebStdout `
            -RedirectStandardError $WebStderr `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "websockify PID: $($WebProcess.Id)"

          # --------------------------------------------------------
          # WAIT FOR LOCAL NOVNC
          # --------------------------------------------------------

          $LocalReady = $false

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 2

            if ($WebProcess.HasExited) {
              Get-Content $WebStderr -ErrorAction SilentlyContinue
              throw "websockify exited unexpectedly."
            }

            $Tcp = Test-NetConnection `
              -ComputerName 127.0.0.1 `
              -Port $WebPort `
              -WarningAction SilentlyContinue

            if ($Tcp.TcpTestSucceeded) {

              try {
                $Response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:6080/vnc.html" `
                  -UseBasicParsing `
                  -TimeoutSec 10

                if ($Response.StatusCode -eq 200) {
                  $LocalReady = $true
                  break
                }
              }
              catch {
                Write-Host "Waiting for HTTP..."
              }
            }

            Write-Host "Waiting for noVNC... $i/30"
          }

          if (!$LocalReady) {
            Get-Content $WebStdout -ErrorAction SilentlyContinue
            Get-Content $WebStderr -ErrorAction SilentlyContinue
            throw "Local noVNC did not become ready."
          }

          Write-Host "Local noVNC HTTP: 200"

          # --------------------------------------------------------
          # START CLOUDFLARE QUICK TUNNEL
          # --------------------------------------------------------

          Write-Host "Starting Cloudflare Quick Tunnel..."

          $CfProcess = Start-Process `
            -FilePath $Cloudflared `
            -ArgumentList @(
              "tunnel",
              "--no-autoupdate",
              "--protocol",
              "auto",
              "--edge-ip-version",
              "4",
              "--loglevel",
              "debug",
              "--logfile",
              $CfDebug,
              "--url",
              $Origin
            ) `
            -RedirectStandardOutput $CfStdout `
            -RedirectStandardError $CfStderr `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "cloudflared PID: $($CfProcess.Id)"

          # --------------------------------------------------------
          # WAIT FOR TUNNEL
          # --------------------------------------------------------

          $TunnelUrl = $null
          $Registered = $false

          for ($i = 1; $i -le 90; $i++) {

            Start-Sleep -Seconds 2

            if ($CfProcess.HasExited) {
              Get-Content $CfDebug -Tail 100 -ErrorAction SilentlyContinue
              throw "cloudflared exited unexpectedly."
            }

            $Content = ""

            foreach ($Log in @($CfStdout, $CfStderr, $CfDebug)) {
              if (Test-Path $Log) {
                $Content += "`n" + (
                  Get-Content $Log -Raw -ErrorAction SilentlyContinue
                )
              }
            }

            if (!$TunnelUrl) {
              $Match = [regex]::Match(
                $Content,
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
              )

              if ($Match.Success) {
                $TunnelUrl = $Match.Value
              }
            }

            if ($Content -match "Registered tunnel connection") {
              $Registered = $true
            }

            if ($TunnelUrl) {
              Write-Host "Tunnel URL: $TunnelUrl"
            }

            if ($Registered) {
              Write-Host "Cloudflare tunnel registered."
              break
            }

            Write-Host "Waiting for Cloudflare... $i/90"
          }

          if (!$TunnelUrl) {
            Get-Content $CfDebug -Tail 200 -ErrorAction SilentlyContinue
            throw "Cloudflare did not create a Quick Tunnel URL."
          }

          if (!$Registered) {
            Get-Content $CfDebug -Tail 200 -ErrorAction SilentlyContinue
            throw "Cloudflare tunnel was not registered."
          }

          # --------------------------------------------------------
          # TEST PUBLIC URL
          # --------------------------------------------------------

          $NoVncUrl = "$TunnelUrl/vnc.html"

          Write-Host "Testing public noVNC..."

          Start-Sleep -Seconds 10

          $PublicReady = $false

          for ($i = 1; $i -le 20; $i++) {

            if ($WebProcess.HasExited -or $CfProcess.HasExited) {
              throw "A required process stopped."
            }

            try {
              $Response = Invoke-WebRequest `
                -Uri $NoVncUrl `
                -UseBasicParsing `
                -TimeoutSec 15

              Write-Host "Public HTTP: $($Response.StatusCode)"

              if ($Response.StatusCode -eq 200) {
                $PublicReady = $true
                break
              }
            }
            catch {
              Write-Host "Public HTTP retry: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 3
          }

          # --------------------------------------------------------
          # CONNECTION INFORMATION
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    WINDOWS READY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "noVNC URL:"
          Write-Host $NoVncUrl

          Write-Host ""
          Write-Host "VNC username: Not required"
          Write-Host "VNC password: GitHub Secret VNC_PASSWORD"

          Write-Host ""
          Write-Host "RDP username: runneradmin"
          Write-Host "RDP password: GitHub Secret RDP_PASSWORD"

          Write-Host ""
          Write-Host "Mesa driver:"
          Write-Host $env:MESA_DRIVER

          Write-Host ""
          Write-Host "Public HTTP test: $PublicReady"

          Write-Host ""
          Write-Host "============================================================"

          # --------------------------------------------------------
          # KEEP EVERYTHING ALIVE
          # --------------------------------------------------------

          while ($true) {

            Start-Sleep -Seconds 30

            $Now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            if ($WebProcess.HasExited) {
              Get-Content $WebStderr -Tail 100 -ErrorAction SilentlyContinue
              throw "websockify stopped."
            }

            if ($CfProcess.HasExited) {
              Get-Content $CfDebug -Tail 200 -ErrorAction SilentlyContinue
              throw "cloudflared stopped."
            }

            $VncService = Get-Service `
              -Name tvnserver `
              -ErrorAction SilentlyContinue

            if (!$VncService -or $VncService.Status -ne "Running") {
              throw "TightVNC service stopped."
            }

            Write-Host "[$Now] Windows + Mesa + VNC + noVNC + Cloudflare alive."
          }
