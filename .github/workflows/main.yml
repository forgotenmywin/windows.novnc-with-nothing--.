
name: Windows 11 - RDP + noVNC + Cloudflare

"on":
  workflow_dispatch:

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # CONFIGURE RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $Username = "runneradmin"
          $Password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($Password)) {
            throw "RDP_PASSWORD secret is missing."
          }

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $SecurePassword = ConvertTo-SecureString `
            $Password -AsPlainText -Force

          $Existing = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($Existing) {
            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword
          }
          else {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          "RDP_USER=$Username" >> $env:GITHUB_ENV

          Write-Host "RDP configured."

      # ============================================================
      # INSTALL TIGHTVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $Installer = "$env:TEMP\tightvnc.msi"
          $VncPassword = $env:VNC_PASSWORD

          if ([string]::IsNullOrWhiteSpace($VncPassword)) {
            throw "VNC_PASSWORD secret is missing."
          }

          if ($VncPassword.Length -lt 8) {
            throw "VNC password must contain at least 8 characters."
          }

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" `
            -OutFile $Installer

          if (!(Test-Path $Installer)) {
            throw "TightVNC installer download failed."
          }

          $Arguments = @(
            "/i"
            "`"$Installer`""
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_ACCEP­TRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$VncPassword"
          )

          $Process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $Arguments `
            -Wait -PassThru

          if ($Process.ExitCode -notin @(0, 3010)) {
            throw "TightVNC installation failed: $($Process.ExitCode)"
          }

          Write-Host "TightVNC installation completed."

      # ============================================================
      # CONFIGURE AND START TIGHTVNC
      # ============================================================
      - name: Start TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $VncExe = "C:\Program Files\TightVNC\tvnserver.exe"
          $RegPath = "HKLM:\SOFTWARE\TightVNC\Server"

          if (!(Test-Path $VncExe)) {
            throw "TightVNC executable not found."
          }

          if (!(Test-Path $RegPath)) {
            throw "TightVNC registry key not found."
          }

          $Settings = @{
            AcceptRfbConnections = 1
            RfbPort = 5900
            UseVncAuthentication = 1
            UseControlAuthentication = 0
            AllowLoopback = 1
            LoopbackOnly = 0
          }

          foreach ($Entry in $Settings.GetEnumerator()) {
            New-ItemProperty `
              -Path $RegPath `
              -Name $Entry.Key `
              -PropertyType DWord `
              -Value $Entry.Value `
              -Force | Out-Null
          }

          $Config = Get-ItemProperty -Path $RegPath

          if ($null -eq $Config.Password) {
            throw "TightVNC password registry value missing."
          }

          Write-Host "TightVNC registry settings verified."

          & $VncExe -stop -silent 2>$null
          Start-Sleep -Seconds 3

          & $VncExe -start -silent 2>$null
          Start-Sleep -Seconds 5

          $Service = Get-Service `
            -Name "tvnserver" `
            -ErrorAction SilentlyContinue

          if ($Service -and $Service.Status -ne "Running") {
            Start-Service -Name "tvnserver"
          }

          Get-Service -Name "tvnserver"

      # ============================================================
      # VERIFY VNC
      # ============================================================
      - name: Verify VNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {
            $Result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -WarningAction SilentlyContinue

            if ($Result.TcpTestSucceeded) {
              $Ready = $true
              break
            }

            Write-Host "Waiting for VNC $i/30"
            Start-Sleep -Seconds 2
          }

          if (!$Ready) {
            throw "VNC server is not listening on port 5900."
          }

          Write-Host "VNC READY: 127.0.0.1:5900"

      # ============================================================
      # INSTALL NOVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $NoVncPath = "C:\noVNC"

          if (Test-Path $NoVncPath) {
            Remove-Item $NoVncPath -Recurse -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $NoVncPath

          if (!(Test-Path "$NoVncPath\vnc.html")) {
            throw "noVNC installation failed."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # INSTALL WEBSOCKIFY
      # ============================================================
      - name: Install websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$Python) {
            throw "Python is not available on this runner."
          }

          $PythonPath = $Python.Source

          & $PythonPath -m pip install --upgrade pip
          & $PythonPath -m pip install websockify

          if ($LASTEXITCODE -ne 0) {
            throw "websockify installation failed."
          }

          $PythonDir = Split-Path $PythonPath
          $Websockify = Join-Path $PythonDir "Scripts\websockify.exe"

          if (!(Test-Path $Websockify)) {
            throw "websockify.exe not found."
          }

          "WEBSOCKIFY_EXE=$Websockify" >> $env:GITHUB_ENV

          Write-Host "websockify installed."

      # ============================================================
      # INSTALL CLOUDFLARED
      # ============================================================
      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $Cloudflared

          if (!(Test-Path $Cloudflared)) {
            throw "cloudflared download failed."
          }

          & $Cloudflared version

          "CLOUDFLARED_EXE=$Cloudflared" >> $env:GITHUB_ENV

      # ============================================================
      # START NOVNC + CLOUDFLARE
      # ============================================================
      - name: Start noVNC + Cloudflare and Keep Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $NoVncPath = "C:\noVNC"
          $Websockify = $env:WEBSOCKIFY_EXE
          $Cloudflared = $env:CLOUDFLARED_EXE

          $VncTarget = "127.0.0.1:5900"
          $WebPort = 6080
          $Origin = "http://127.0.0.1:6080"

          $WebStdout = "C:\websockify.log"
          $WebStderr = "C:\websockify-error.log"

          $CfStdout = "C:\cloudflared-stdout.log"
          $CfStderr = "C:\cloudflared-stderr.log"
          $CfDebug = "C:\cloudflared-debug.log"

          Remove-Item `
            $WebStdout,$WebStderr,$CfStdout,$CfStderr,$CfDebug `
            -Force -ErrorAction SilentlyContinue

          # START WEBSOCKIFY

          $WebProcess = Start-Process `
            -FilePath $Websockify `
            -ArgumentList @(
              "--web",
              $NoVncPath,
              "--verbose",
              "0.0.0.0:6080",
              $VncTarget
            ) `
            -WorkingDirectory $NoVncPath `
            -RedirectStandardOutput $WebStdout `
            -RedirectStandardError $WebStderr `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "websockify PID: $($WebProcess.Id)"

          # WAIT FOR NOVNC

          $LocalReady = $false

          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 2

            if ($WebProcess.HasExited) {
              throw "websockify exited unexpectedly."
            }

            try {
              $Response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:6080/vnc.html" `
                -UseBasicParsing `
                -TimeoutSec 10

              if ($Response.StatusCode -eq 200) {
                $LocalReady = $true
                break
              }
            }
            catch {
              Write-Host "Waiting for HTTP..."
            }
          }

          if (!$LocalReady) {
            throw "Local noVNC did not become ready."
          }

          Write-Host "Local noVNC HTTP: 200"

          # START CLOUDFLARE

          $CfProcess = Start-Process `
            -FilePath $Cloudflared `
            -ArgumentList @(
              "tunnel",
              "--no-autoupdate",
              "--protocol",
              "auto",
              "--edge-ip-version",
              "4",
              "--loglevel",
              "debug",
              "--logfile",
              $CfDebug,
              "--url",
              $Origin
            ) `
            -RedirectStandardOutput $CfStdout `
            -RedirectStandardError $CfStderr `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "cloudflared PID: $($CfProcess.Id)"

          # WAIT FOR CLOUDFLARE

          $TunnelUrl = $null
          $Registered = $false

          for ($i = 1; $i -le 90; $i++) {
            Start-Sleep -Seconds 2

            if ($CfProcess.HasExited) {
              throw "cloudflared exited unexpectedly."
            }

            $Content = ""

            foreach ($Log in @($CfStdout,$CfStderr,$CfDebug)) {
              if (Test-Path $Log) {
                $Content += "`n" + (Get-Content $Log -Raw)
              }
            }

            if (!$TunnelUrl) {
              $Match = [regex]::Match(
                $Content,
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
              )

              if ($Match.Success) {
                $TunnelUrl = $Match.Value
              }
            }

            if ($Content -match "Registered tunnel connection") {
              $Registered = $true
            }

            if ($TunnelUrl -and $Registered) {
              break
            }

            Write-Host "Waiting for Cloudflare $i/90"
          }

          if (!$TunnelUrl) {
            throw "Cloudflare Quick Tunnel URL was not created."
          }

          if (!$Registered) {
            throw "Cloudflare tunnel was not registered."
          }

          # PUBLIC URL

          $NoVncUrl = "$TunnelUrl/vnc.html"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "             noVNC READY"
          Write-Host "============================================"
          Write-Host "URL: $NoVncUrl"
          Write-Host "RDP USER: runneradmin"
          Write-Host "============================================"

          "NOVNC_URL=$NoVncUrl" >> $env:GITHUB_ENV

          # KEEP ALIVE

          while ($true) {
            Start-Sleep -Seconds 30

            $Now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            if ($WebProcess.HasExited) {
              throw "websockify stopped."
            }

            if ($CfProcess.HasExited) {
              throw "cloudflared stopped."
            }

            $VncService = Get-Service `
              -Name "tvnserver" `
              -ErrorAction SilentlyContinue

            if (!$VncService -or $VncService.Status -ne "Running") {
              throw "TightVNC service stopped."
            }

            Write-Host "[$Now] Windows + TightVNC + noVNC + Cloudflare alive."
          }
